<ng-container>
  @if (breakpoint > breakpoints.MOBILE) {
    <a href="https://www.tianditu.gov.cn/" class="mapbox-logo" target="_blank"
      >天地图</a
    >
    <div class="position-right attribute-box">
      © {{ anio }} 成都理工大学 成理一号
      <span class="text-spacing">|</span>
      <a href="https://www.tianditu.gov.cn/" target="_blank">© 天地图</a>
    </div>
    <div class="position-right--filler attribute-box">&nbsp;</div>
  }

  @if (breakpoint === breakpoints.MOBILE) {
    <div class="bottom-search-bar">
      <div class="bar-layout">
        <app-max-results-selector
          class="max-results-spacing"
        ></app-max-results-selector>
        <app-search-button></app-search-button>
      </div>
    </div>
  }
  @if (breakpoint === breakpoints.SMALL) {
    <div class="bar"></div>
  }
</ng-container>
