@if (!isAuthenticated()) {
  <app-login (onSuccess)="onLoginSuccess($event)"></app-login>
}

<div
  class="app-shell"
  [class.app-mobile]="breakpoint === breakpoints.MOBILE"
>
  <header class="brand-bar">
    <div class="brand-left">
      <img
        class="brand-logo"
        src="/assets/branding/chengli-1-logo-v1.png"
        alt="成理一号"
      />
      <div class="brand-titles">
        <span class="brand-name">{{ platform.name }}</span>
        <span class="brand-sub">{{ platform.fullName }}</span>
      </div>
    </div>
    <div class="brand-right">
      <span class="brand-org">{{ platform.organization }}</span>

      <button
        class="brand-action"
        [attr.title]="'CART' | translate"
        [attr.aria-label]="'CART' | translate"
        (click)="onOpenDownloadQueue()"
      >
        <mat-icon
          [matBadge]="(queuedProducts$ | async)?.length || 0"
          matBadgeColor="accent"
          matBadgePosition="above after"
          matBadgeOverlap="true"
          matBadgeSize="small"
          [matBadgeHidden]="((queuedProducts$ | async)?.length || 0) === 0"
          >shopping_cart</mat-icon
        >
      </button>

      <button
        class="brand-action"
        [attr.title]="'ORDERS' | translate"
        [attr.aria-label]="'ORDERS' | translate"
        (click)="onOpenProcessingQueue()"
      >
        <mat-icon
          [matBadge]="queuedCustomProducts().length || 0"
          matBadgeColor="accent"
          matBadgePosition="above after"
          matBadgeOverlap="true"
          matBadgeSize="small"
          [matBadgeHidden]="(queuedCustomProducts().length || 0) === 0"
          >receipt_long</mat-icon
        >
      </button>

      <button
        class="brand-action"
        [attr.title]="'DOWNLOADS' | translate"
        [attr.aria-label]="'DOWNLOADS' | translate"
        (click)="onOpenDownloadsDialog()"
      >
        <mat-icon>file_download</mat-icon>
      </button>

      <button
        class="brand-action"
        [attr.title]="'NOTIFICATIONS' | translate"
        [attr.aria-label]="'NOTIFICATIONS' | translate"
        (click)="onOpenNotifications()"
      >
        <mat-icon
          [matBadge]="(unreadCount$ | async) || 0"
          matBadgeColor="accent"
          matBadgePosition="above after"
          matBadgeOverlap="true"
          matBadgeSize="small"
          [matBadgeHidden]="((unreadCount$ | async) || 0) === 0"
          >notifications</mat-icon
        >
      </button>

      @if (sessionEmail()) {
        <button
          class="brand-action"
          [matMenuTriggerFor]="accountMenu"
          [attr.title]="'PROFILE' | translate"
          [attr.aria-label]="'PROFILE' | translate"
        >
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu
          #accountMenu="matMenu"
          class="account-menu"
          panelClass="account-menu"
          xPosition="before"
        >
          <button mat-menu-item (click)="onOpenUserInfo()">
            <mat-icon>person_outline</mat-icon>
            <span>{{ 'USER_INFO' | translate }}</span>
          </button>
          <button mat-menu-item (click)="onLogout()">
            <mat-icon>logout</mat-icon>
            <span>{{ 'SIGN_OUT' | translate }}</span>
          </button>
        </mat-menu>
      }
    </div>
  </header>

  <mat-sidenav-container
    class="container"
    (backdropClick)="onCloseSidebar()"
  >
    <mat-sidenav
      [ngClass]="{
        'app-sidenav-mobile': breakpoint <= breakpoints.SMALL,
        'app-sidenav': breakpoint > breakpoints.SMALL,
      }"
      #sidenav
    >
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="app-body">
        <nav class="app-rail">
          <button
            class="rail-item active"
            [attr.title]="'QUERY' | translate"
            (click)="onCloseSidebar()"
          >
            <mat-icon>search</mat-icon>
            <span>{{ 'QUERY' | translate }}</span>
          </button>
          <button
            class="rail-item"
            [attr.title]="'SAVED_SEARCHES' | translate"
            (click)="openSavedSearches()"
          >
            <mat-icon>star_border</mat-icon>
            <span>{{ 'SAVED_SEARCHES' | translate }}</span>
          </button>
          <button
            class="rail-item"
            [attr.title]="'SEARCH_HISTORY' | translate"
            (click)="openSearchHistory()"
          >
            <mat-icon>history</mat-icon>
            <span>{{ 'SEARCH_HISTORY' | translate }}</span>
          </button>
          <button
            class="rail-item disabled"
            [attr.title]="'EXPORT' | translate"
            disabled
          >
            <mat-icon>download</mat-icon>
            <span>{{ 'EXPORT' | translate }}</span>
          </button>
        </nav>

        <aside class="search-panel">
          <app-header [isLoading]="isLoading$ | async"> </app-header>
        </aside>

        <main class="map-area">
          <app-map (loadUrlState)="onLoadUrlState()"> </app-map>
          <app-results-menu id="TSRESULTS"> </app-results-menu>
        </main>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

  @if (isUserCenterOpen()) {
    <app-user-center (closed)="isUserCenterOpen.set(false)"></app-user-center>
  }
</div>
