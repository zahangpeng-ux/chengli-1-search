@if (!isAuthenticated()) {
  <app-login (onSuccess)="onLoginSuccess($event)"></app-login>
}

<div
  class="app-shell"
  [class.app-mobile]="breakpoint === breakpoints.MOBILE"
>
  <header class="brand-bar">
    <div class="brand-left">
      <img
        class="brand-logo"
        src="/assets/branding/chengli-1-logo-v1.png"
        alt="成理一号"
      />
      <div class="brand-titles">
        <span class="brand-name">{{ platform.name }}</span>
        <span class="brand-sub">{{ platform.fullName }}</span>
      </div>
    </div>
    <div class="brand-right">
      <span class="brand-org">{{ platform.organization }}</span>
      @if (sessionEmail()) {
        <span class="brand-user">
          <mat-icon>account_circle</mat-icon>
          <span class="brand-user-email">{{ sessionEmail() }}</span>
        </span>
        <button
          class="brand-help"
          title="退出登录"
          aria-label="退出登录"
          (click)="onLogout()"
        >
          <mat-icon>logout</mat-icon>
        </button>
      }
      <button
        class="brand-help"
        [attr.title]="'HELP' | translate"
        [attr.aria-label]="'HELP' | translate"
      >
        <mat-icon>help_outline</mat-icon>
      </button>
    </div>
  </header>

  <mat-sidenav-container
    class="container"
    (backdropClick)="onCloseSidebar()"
  >
    <mat-sidenav
      [ngClass]="{
        'app-sidenav-mobile': breakpoint <= breakpoints.SMALL,
        'app-sidenav': breakpoint > breakpoints.SMALL,
      }"
      #sidenav
    >
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
      <div class="app-body">
        <nav class="app-rail">
          <button
            class="rail-item active"
            [attr.title]="'QUERY' | translate"
            (click)="onCloseSidebar()"
          >
            <mat-icon>search</mat-icon>
            <span>{{ 'QUERY' | translate }}</span>
          </button>
          <button
            class="rail-item"
            [attr.title]="'SAVED_SEARCHES' | translate"
            (click)="openSavedSearches()"
          >
            <mat-icon>star_border</mat-icon>
            <span>{{ 'SAVED_SEARCHES' | translate }}</span>
          </button>
          <button
            class="rail-item"
            [attr.title]="'SEARCH_HISTORY' | translate"
            (click)="openSearchHistory()"
          >
            <mat-icon>history</mat-icon>
            <span>{{ 'SEARCH_HISTORY' | translate }}</span>
          </button>
          <button
            class="rail-item disabled"
            [attr.title]="'EXPORT' | translate"
            disabled
          >
            <mat-icon>download</mat-icon>
            <span>{{ 'EXPORT' | translate }}</span>
          </button>
        </nav>

        <aside class="search-panel">
          <app-header [isLoading]="isLoading$ | async"> </app-header>
        </aside>

        <main class="map-area">
          <app-map (loadUrlState)="onLoadUrlState()"> </app-map>
          <app-results-menu id="TSRESULTS"> </app-results-menu>
        </main>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
